async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(IV)},key,d(CT));
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('vms',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='';
  try{await open(document.getElementById('p').value)}catch(x){err.textContent='Incorrect password.'}
});
